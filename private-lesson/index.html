<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a Private Lesson | Bares Taekwondo Fitness | Tyler, TX</title>
<meta name="description" content="Book a one-on-one private lesson with Mr. Race Bares at Bares Taekwondo Fitness in Tyler, TX.">
<link rel="canonical" href="https://www.barestkd.fit/private-lesson/">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
/* One narrow column at every width: this is a form, not a landing page. */
.pl-col{max-width:640px;margin-inline:auto}
/* Lead line, then the smaller prompt under it, matching how each option
   card stacks its title and note. */
.pl-lead{margin:0 0 4px;color:#5b6570}
.pl-under{margin:0 0 22px;font-size:.87rem;color:#5b6570}
.pl-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 16px}
.pl-step > h2{margin:0 0 4px;font-size:1.15rem}
.pl-step .step-sub{margin:0 0 14px;font-size:.9rem;color:#5b6570}

/* Day, then times inside it. A private lesson is chosen by "when can I come",
   so the day leads and the times sit under it. */
.pl-day{border-bottom:1px solid #f0f0f0;padding:12px 0}
.pl-day:last-child{border-bottom:none}
.pl-dayname{font-weight:700;font-size:.97rem;margin-bottom:8px}
.pl-slots{display:flex;flex-wrap:wrap;gap:8px}
.pl-slot{appearance:none;background:#fff;border:2px solid var(--line);border-radius:10px;
  padding:9px 14px;font:inherit;font-weight:600;font-size:.93rem;cursor:pointer;color:inherit}
.pl-slot:hover{border-color:var(--belt-red)}
.pl-slot.on{background:var(--belt-red);border-color:var(--belt-red);color:#fff}
/* Booked. Still shown, so a full day reads as "that filled up" rather than
   "we don't teach then", but plainly not a thing you can click. */
.pl-gone{background:#F2F3F5;border-color:#E4E6EA;color:#9AA1AA;
  text-decoration:line-through;cursor:not-allowed}
.pl-gone:hover{border-color:#E4E6EA}
.pl-scroll{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 14px}

/* What they are buying. Two cards, the pack one carries the saving. */
.pl-opts{display:grid;gap:10px}
.pl-opt{display:flex;align-items:flex-start;gap:12px;border:2px solid var(--line);
  border-radius:12px;padding:14px;cursor:pointer;background:#fff}
.pl-opt.on{border-color:var(--belt-red);background:#FFF6F6}
.pl-opt input{margin-top:3px;width:18px;height:18px;flex:none}
/* Both are spans, so they need to be told to stack: left inline, the note ran
   on the same line as the title instead of under it. */
.pl-opt .t{display:block;font-weight:700}
.pl-opt .d{display:block;font-size:.87rem;color:#5b6570;margin-top:3px;line-height:1.5}
.pl-opt .p{margin-left:auto;font-weight:700;white-space:nowrap}
.pl-save{display:inline-block;background:#E4F5EE;color:#0B7A55;border-radius:6px;
  padding:2px 8px;font-size:.75rem;font-weight:700;margin-left:8px}

.pl-f{margin:0 0 12px}
.pl-f label{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}
.pl-f input,.pl-f textarea{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);
  border-radius:10px;background:#fff;color:inherit}
.pl-f textarea{min-height:80px;resize:vertical}
.pl-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.pl-row{grid-template-columns:1fr}}
.pl-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.pl-card{border:2px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.pl-cardload{color:#5b6570;font-size:13.5px}
.pl-carderr{display:none;color:var(--belt-red);font-size:13.5px;margin-top:8px;font-weight:600}

.pl-sum{margin-top:14px}
.pl-line{display:flex;justify-content:space-between;padding:4px 0;font-size:.93rem;color:#5b6570}
.pl-total{display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--line);margin-top:8px;padding-top:12px;font-weight:700;font-size:1.1rem}
.pl-note{font-size:.87rem;color:#5b6570;line-height:1.6;margin-top:10px}
.pl-err{display:none;background:#FFF6F6;border-left:4px solid var(--belt-red);
  padding:12px 14px;border-radius:0 10px 10px 0;font-size:.93rem;margin:0 0 14px;font-weight:600}
.pl-closed{background:#FFF6F6;border-left:4px solid var(--belt-red);padding:16px 18px;
  border-radius:0 12px 12px 0;font-size:.97rem;line-height:1.6}
.pl-ok{text-align:center;padding:10px 0}
.pl-ok .big{font-size:1.4rem;font-weight:700;margin:0 0 8px}
.pl-btn{width:100%;margin-top:6px}
.pl-btn[disabled]{opacity:.55;cursor:default}
</style>
</head>
<body>
<div id="siteHeader"></div>

<main class="section">
  <div class="container pl-col">

    <h1 style="margin:0 0 6px">Private Lessons</h1>
    <p class="pl-lead">30 minutes, one-on-one with Mr. Race Bares.</p>
    <p class="pl-under">Open times from our schedule:</p>

    <div id="pl-live"></div>

    <form id="pl-form" style="display:none" autocomplete="on">
      <div class="pl-err" id="pl-err"></div>

      <section class="pl-step">
        <h2>Pick a time</h2>
        <div class="pl-scroll"><div id="pl-days"></div></div>
      </section>

      <section class="pl-step">
        <h2>How many</h2>
        <div class="pl-opts" id="pl-opts"></div>
      </section>

      <section class="pl-step">
        <h2>Who is training</h2>
        <div class="pl-f">
          <label for="pl-student">Student name</label>
          <input id="pl-student" name="student" autocomplete="off" placeholder="Who the lesson is for">
        </div>
        <div class="pl-row">
          <div class="pl-f">
            <label for="pl-first">Your first name</label>
            <input id="pl-first" name="given-name" autocomplete="given-name" required>
          </div>
          <div class="pl-f">
            <label for="pl-last">Your last name</label>
            <input id="pl-last" name="family-name" autocomplete="family-name" required>
          </div>
        </div>
        <div class="pl-row">
          <div class="pl-f">
            <label for="pl-email">Email</label>
            <input id="pl-email" type="email" name="email" autocomplete="email" required>
          </div>
          <div class="pl-f">
            <label for="pl-phone">Phone</label>
            <input id="pl-phone" type="tel" name="tel" autocomplete="tel" required>
          </div>
        </div>
        <div class="pl-f">
          <label for="pl-notes">Anything to work on? (optional)</label>
          <textarea id="pl-notes" placeholder="Forms, sparring, a specific technique, testing prep…"></textarea>
        </div>
        <div class="pl-hp"><label>Leave this empty<input id="pl-hp" tabindex="-1" autocomplete="off"></label></div>
      </section>

      <section class="pl-step">
        <h2>Payment</h2>
        <div class="pl-f">
          <label for="pl-card">Card</label>
          <div class="pl-card" id="pl-card"><span class="pl-cardload">Loading the card field…</span></div>
          <div class="pl-carderr" id="pl-carderr"></div>
        </div>
        <div class="pl-sum" id="pl-sum"></div>
        <div class="pl-total"><span>Total</span><span id="pl-total"></span></div>
        <button class="btn btn--primary pl-btn" id="pl-go" type="submit">Book and pay</button>
      </section>
    </form>

    <div id="pl-done" style="display:none"></div>
  </div>
</main>

<div id="siteFooter"></div>
<script src="/assets/js/site.js" defer></script>
<script>
(function () {
  "use strict";
  var FN = "https://akdncbzxiwvihfcyijvm.supabase.co/functions/v1/private-checkout";
  var SB_KEY = "sb_publishable_uSGIk4_Tt1_BOmPBoC_U5A_Kp2032f5"; // public key - safe to ship
  var PHONE = "903-561-2966";

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  };
  var money = function (c) { return "$" + (c / 100).toFixed(2); };

  var CFG = null, SALE_ID = null, STRIPE = null, CARD = null;
  var picked = null;   // { iso, label, dayLabel }
  var wantPack = false;
  var busy = false;

  if (window.crypto && crypto.randomUUID) SALE_ID = crypto.randomUUID();

  function closed(msg) {
    $("pl-live").innerHTML = '<div class="pl-closed">' + msg
      + ' <br><br>Call or text <a href="tel:+19035612966">' + PHONE + '</a> and we will get you on the schedule.</div>';
    $("pl-form").style.display = "none";
  }
  function showErr(msg) {
    var el = $("pl-err");
    if (!msg) { el.style.display = "none"; return; }
    el.textContent = msg; el.style.display = "block";
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function cardErr(msg) {
    var el = $("pl-carderr");
    if (!msg) { el.style.display = "none"; return; }
    el.textContent = msg; el.style.display = "block";
  }

  // ── boot ───────────────────────────────────────────────────────────────
  fetch(FN, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } })
    .then(function (r) { if (!r.ok) throw new Error("bad " + r.status); return r.json(); })
    .then(function (cfg) {
      CFG = cfg;
      if (!cfg.page_live) {
        closed("Private lesson booking is not open online right now.");
        return;
      }
      if (!(cfg.days || []).length) {
        closed("There are no open lesson times in the next few weeks.");
        return;
      }
      $("pl-form").style.display = "";
      renderDays();
      renderOpts();
      mountCard();
      total();
    })
    .catch(function () {
      // Fails closed: a booking page that cannot reach the server must not
      // pretend to take a booking.
      closed("We could not load the lesson times just now.");
    });

  function renderDays() {
    var h = "";
    CFG.days.forEach(function (d, di) {
      h += '<div class="pl-day"><div class="pl-dayname">' + esc(d.label) + '</div><div class="pl-slots">';
      d.slots.forEach(function (s, si) {
        // Taken times stay on the page, greyed and unclickable, so the regular
        // weekly shape is visible even on a day that is fully booked.
        h += '<button type="button" class="pl-slot' + (s.taken ? ' pl-gone' : '') + '"'
          + (s.taken ? ' disabled aria-label="' + esc(s.label) + ', already booked"' : '')
          + ' data-d="' + di + '" data-s="' + si + '">' + esc(s.label) + '</button>';
      });
      h += '</div></div>';
    });
    $("pl-days").innerHTML = h;
    Array.prototype.forEach.call($("pl-days").querySelectorAll(".pl-slot"), function (b) {
      b.addEventListener("click", function () {
        var d = CFG.days[+b.getAttribute("data-d")];
        var s = d.slots[+b.getAttribute("data-s")];
        picked = { iso: s.iso, label: s.label, dayLabel: d.label };
        Array.prototype.forEach.call($("pl-days").querySelectorAll(".pl-slot"), function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        showErr("");
      });
    });
  }

  // The buttons carry the lesson price. Card processing is broken out at the
  // bottom, next to the total, so the arithmetic is theirs to see.
  function renderOpts() {
    var one = CFG.rate_cents, pack = CFG.pack_cents, n = CFG.pack_size;
    // "6 plus 1 free", never "7 lessons, 1 free": the second reads as though
    // the free one might be an eighth.
    var payFor = Math.round(CFG.pack_cents / CFG.rate_cents);
    var free = n - payFor;
    var h = ""
      + '<label class="pl-opt on" data-pack="0"><input type="radio" name="plopt" checked>'
      + '<span><span class="t">One lesson</span></span>'
      + '<span class="p">' + money(one) + '</span></label>'
      + '<label class="pl-opt" data-pack="1"><input type="radio" name="plopt">'
      + '<span><span class="t">' + payFor + ' lessons plus ' + free + ' free</span>'
      + '<span class="d">' + n + ' in all. We schedule the other ' + (n - 1) + ' with you.</span></span>'
      + '<span class="p">' + money(pack) + '</span></label>';
    $("pl-opts").innerHTML = h;
    Array.prototype.forEach.call($("pl-opts").querySelectorAll(".pl-opt"), function (l) {
      l.addEventListener("click", function () {
        wantPack = l.getAttribute("data-pack") === "1";
        Array.prototype.forEach.call($("pl-opts").querySelectorAll(".pl-opt"), function (x) { x.classList.remove("on"); });
        l.classList.add("on");
        l.querySelector("input").checked = true;
        total();
      });
    });
  }

  // Show the lesson and the processing charge as separate lines, the way every
  // other checkout page does, rather than one blended number.
  function total() {
    var base = wantPack ? CFG.pack_cents : CFG.rate_cents;
    var sum = wantPack ? CFG.pack_total_cents : CFG.single_total_cents;
    var payFor = Math.round(CFG.pack_cents / CFG.rate_cents);
    var label = wantPack
      ? payFor + " lessons plus " + (CFG.pack_size - payFor) + " free"
      : "Lesson";
    $("pl-sum").innerHTML =
      '<div class="pl-line"><span>' + label + '</span><span>' + money(base) + '</span></div>'
      + '<div class="pl-line"><span>Card processing</span><span>' + money(sum - base) + '</span></div>';
    $("pl-total").textContent = money(sum);
  }

  function loadStripeJs(cb) {
    if (window.Stripe) { cb(); return; }
    var s = document.createElement("script");
    s.src = "https://js.stripe.com/v3/";
    s.onload = cb;
    s.onerror = function () { $("pl-card").innerHTML = '<span class="pl-cardload">Card payments are unavailable right now.</span>'; };
    document.head.appendChild(s);
  }
  function mountCard() {
    if (!CFG.publishable_key) {
      $("pl-card").innerHTML = '<span class="pl-cardload">Card payments are not set up yet.</span>';
      return;
    }
    loadStripeJs(function () {
      try {
        STRIPE = Stripe(CFG.publishable_key);
        CARD = STRIPE.elements().create("card", { style: { base: { fontSize: "16px", color: "#15171C" } } });
        $("pl-card").innerHTML = "";
        CARD.mount("#pl-card");
        CARD.on("change", function (e) { cardErr(e.error ? e.error.message : ""); });
      } catch (e) {
        $("pl-card").innerHTML = '<span class="pl-cardload">Card payments are unavailable right now.</span>';
      }
    });
  }

  function post(body) {
    return fetch(FN, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }

  function done(html) {
    $("pl-form").style.display = "none";
    $("pl-live").innerHTML = "";
    $("pl-done").style.display = "";
    $("pl-done").innerHTML = '<div class="pl-step pl-ok">' + html + '</div>';
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("pl-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (busy) return;
    showErr("");

    if (!picked) { showErr("Pick a lesson time first."); return; }
    var first = $("pl-first").value.trim(), last = $("pl-last").value.trim();
    var email = $("pl-email").value.trim(), phone = $("pl-phone").value.trim();
    if (!first || !last) { showErr("We need your first and last name."); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr("That email does not look right."); return; }
    if (!phone) { showErr("We need a phone number in case we have to reach you."); return; }

    // The card is checked HERE, before a single record is written. Not a
    // charge: createPaymentMethod only asks Stripe to validate the entry and
    // hand back a token. A bad card stops at this line and creates nothing
    // (2026-08-26 - a parent was fully enrolled with a signed agreement after
    // her card entry was rejected at this step).
    if (!CARD) { showErr("The card field has not loaded yet. Give it a moment or reload the page."); return; }
    var PM = null;
    try {
      var pmRes = await STRIPE.createPaymentMethod({ type: "card", card: CARD });
      if (pmRes.error) {
        cardErr(pmRes.error.message || "Please check the card details.");
        showErr(pmRes.error.message || "Please check the card details and try again.");
        try {
          navigator.sendBeacon && navigator.sendBeacon(
            "https://akdncbzxiwvihfcyijvm.supabase.co/functions/v1/card-reject?src=private-lesson",
            JSON.stringify({ code: pmRes.error.code || "", message: pmRes.error.message || "", who: (function(){ var g=function(i){var e=document.getElementById(i);return e && e.value ? String(e.value).trim() : "";}; return { parent: (g("lkc-pfirst")+" "+g("lkc-plast")).trim() || (g("tst-pfirst")+" "+g("tst-plast")).trim() || (g("pl-first")+" "+g("pl-last")).trim() || g("lkc-signer"), student: (g("lkc-sfirst")+" "+g("lkc-slast")).trim() || g("pl-student"), email: g("lkc-email") || g("tst-email") || g("pl-email"), phone: g("lkc-phone") || g("tst-phone") || g("pl-phone") }; })() }));
        } catch (e2) {}
        return;
      }
      PM = pmRes.paymentMethod;
    } catch (e1) {
      showErr("Could not check the card. Please try again.");
      return;
    }

    busy = true;
    $("pl-go").disabled = true;
    $("pl-go").textContent = "Booking…";

    post({
      sale_id: SALE_ID,
      first_name: first, last_name: last,
      student_name: $("pl-student").value.trim(),
      email: email, phone: phone,
      notes: $("pl-notes").value.trim(),
      slot_iso: picked.iso,
      pack: wantPack,
      hp: $("pl-hp").value,
    }).then(function (res) {
      if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : "Something went wrong.");
      if (res.j.paid) { done('<p class="big">You are booked.</p><p>Check your email for the receipt.</p>'); return null; }
      if (!res.j.client_secret) {
        window.location.href = res.j.receipt_url;
        return null;
      }
      return STRIPE.confirmCardPayment(res.j.client_secret, { payment_method: PM.id })
        .then(function (r2) {
          if (r2.error) throw new Error(r2.error.message);
          return post({ action: "finalize", sale_id: SALE_ID, payment_intent_id: r2.paymentIntent.id });
        })
        .then(function () {
          done('<p class="big">You are booked.</p>'
            + '<p>' + esc(picked.dayLabel) + ' at ' + esc(picked.label) + '</p>'
            + (wantPack
              ? '<p style="margin-top:12px;color:#5b6570">We will call to schedule your other '
                + (CFG.pack_size - 1) + '.</p>'
              : '')
            + '<p style="margin-top:12px;color:#5b6570">Receipt sent to ' + esc(email) + '.</p>');
        });
    }).catch(function (e) {
      showErr(e.message || "Something went wrong. Please try again or call us at " + PHONE + ".");
    }).then(function () {
      busy = false;
      $("pl-go").disabled = false;
      $("pl-go").textContent = "Book and pay";
    });
  });
})();
</script>
</body>
</html>
