<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Invoice | Bares Taekwondo Fitness</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<!--
  Customer-facing invoice / receipt page.

  Why this page exists: receipts used to link straight at the Supabase
  function URL, which nobody would trust in a text message. This is the same
  invoice on our own domain. The CARD ITSELF is still rendered by the
  receipt-view Edge Function (fragment mode) so there is exactly one invoice
  layout in the system - this page is the trusted wrapper around it.

  The ?t= token is the only gate; it grants this one invoice and nothing else.
  Pay online sends the customer to Stripe hosted checkout via the
  create-checkout function, which re-derives the amount from the ledger - a
  browser can never name its own price. The webhook is what marks the invoice
  paid; the redirect back only polls for that to land.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#EEF1F4;font-family:Arial,Helvetica,sans-serif;color:#1A1D23}
  .wrap{max-width:560px;margin:0 auto;padding:18px 10px 40px}
  .load,.err{background:#fff;border:1px solid #E2E6EB;border-radius:14px;padding:34px 20px;text-align:center;color:#6A727E;font-size:14px;line-height:1.6}
  .err b{display:block;color:#1A1D23;font-size:16px;margin-bottom:6px}
  .pay{background:#fff;border:1px solid #E2E6EB;border-radius:14px;padding:20px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(16,18,22,.06)}
  .pay h2{font-size:17px;margin:0 0 4px}
  .pay p{font-size:13px;color:#6A727E;line-height:1.6;margin:0 0 14px}
  .paybtn{display:block;width:100%;background:#15171C;color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
  .paybtn.off{background:#EEF1F4;color:#6A727E;cursor:default}
  .paybtn[disabled]{opacity:.5;cursor:default}
  .cardbox{border:2px solid #D9DEE3;border-radius:10px;padding:14px 13px;background:#fff;min-height:50px;margin:10px 0}
  .cardbox.StripeElement--focus{border-color:#15171C}
  .cardload{color:#6A727E;font-size:13px;line-height:1.5}
  .amtrow{margin:0 0 12px}
  .amtrow label{display:block;font-size:13px;color:#6A727E;margin-bottom:6px}
  .amtwrap{display:flex;align-items:center;border:2px solid #D9DEE3;border-radius:10px;padding:0 13px;background:#fff}
  .amtwrap:focus-within{border-color:#15171C}
  .amtwrap span{color:#6A727E;font-size:16px;margin-right:4px}
  .amtwrap input{flex:1;border:none;outline:none;font-size:17px;font-weight:700;padding:13px 0;font-family:inherit;color:#1A1D23;background:transparent;min-width:0}
  .amtnote{font-size:12px;color:#6A727E;margin-top:6px}
  .amterr{font-size:12.5px;color:#C0152A;margin-top:6px;display:none}
  .testnote{font-size:12px;color:#6A727E;background:#F4F6F8;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .testnote:empty{display:none}
  .callrow{display:flex;gap:9px;margin-top:10px}
  .payerr{color:#c8102e;font-size:12.5px;font-weight:600;margin-top:9px;min-height:1px}
  .paid-note{background:#E4F5EE;border:1px solid #BFE6D6;color:#18A974;border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:14px;margin-bottom:14px}
  .callrow a{flex:1;text-align:center;border:1.5px solid #E2E6EB;border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:#1A1D23;text-decoration:none}
  .printrow{text-align:center;margin-top:6px}
  .printrow button{background:none;border:1.5px solid #E2E6EB;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:700;color:#1A1D23;cursor:pointer;font-family:inherit}
  @media print{ #pay,.printrow,.foot{display:none!important} body{background:#fff} }
  .foot{text-align:center;font-size:11.5px;color:#98A0AB;line-height:1.7;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div id="pay"></div>
  <div id="root"><div class="load">Loading your invoice…</div></div>
  <div class="foot">
    Bares Taekwondo Fitness · 1901 Deerbrook Dr, Tyler, TX 75703<br>
    Questions? Call <a href="tel:+19035612966" style="color:#98A0AB">903-561-2966</a>
  </div>
</div>

<script>
(function () {
  var FN = 'https://akdncbzxiwvihfcyijvm.supabase.co/functions/v1/receipt-view';
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var root = document.getElementById('root');
  var payBox = document.getElementById('pay');

  // Customers print from the browser; this just makes it obvious they can.
  function addPrint() {
    if (document.getElementById("printrow")) return;
    var d = document.createElement("div");
    d.className = "printrow"; d.id = "printrow";
    d.innerHTML = "<button type=\"button\">Print or save as PDF</button>";
    d.querySelector("button").addEventListener("click", function () { window.print(); });
    root.parentNode.insertBefore(d, root.nextSibling);
  }

  function fail(title, msg) {
    root.innerHTML = '<div class="err"><b>' + title + '</b>' + msg + '</div>';
  }

  if (!/^[0-9a-f]{32}$/i.test(token)) {
    fail('Invoice not found', 'This link looks incomplete. Ask the studio to send it again.');
    return;
  }

  fetch(FN + '?t=' + encodeURIComponent(token) + '&f=frag', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 404 ? 'notfound' : 'server');
      return r.text();
    })
    .then(function (html) {
      root.innerHTML = html;
      // The fragment ships a small JSON state blob so this wrapper can decide
      // what to offer without re-parsing the rendered card.
      var el = document.getElementById('iv-state');
      var st = null;
      try { st = JSON.parse(el.textContent); } catch (e) {}
      if (!st) return;
      document.title = (st.status === 'paid' ? 'Receipt ' : 'Invoice ') + st.short_id + ' | Bares Taekwondo Fitness';
      addPrint();
      var justPaid = new URLSearchParams(location.search).get('paid') === '1';
      if (st.status === 'paid' || st.status === 'closed' || !st.balance_cents) {
        if (justPaid) payBox.innerHTML = '<div class="paid-note">Payment received - thank you!</div>';
        return;
      }
      if (justPaid) {
        // Back from Stripe but the webhook has not landed yet. Do NOT offer
        // to pay again - poll briefly, then tell the truth either way.
        payBox.innerHTML = '<div class="paid-note">Payment submitted - updating this invoice…</div>';
        var tries = 0;
        var poll = setInterval(function () {
          if (++tries > 10) { clearInterval(poll); payBox.innerHTML = '<div class="paid-note">Payment submitted. If this invoice still shows a balance in a few minutes, call the studio.</div>'; return; }
          fetch(FN + '?t=' + encodeURIComponent(token) + '&f=frag', { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (h2) {
              root.innerHTML = h2;
              var s2 = null; try { s2 = JSON.parse(document.getElementById('iv-state').textContent); } catch (e) {}
              if (s2 && (s2.status === 'paid' || !s2.balance_cents)) {
                clearInterval(poll);
                payBox.innerHTML = '<div class="paid-note">Payment received - thank you!</div>';
              }
            }).catch(function () {});
        }, 2000);
        return;
      }

      var due = '$' + (st.balance_cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      // The card is collected HERE rather than on a hosted page: one screen,
      // one button. The number still goes straight into Stripe's iframe, so
      // nothing about PCI scope changes.
      payBox.innerHTML =
        '<div class="pay"><h2>Pay this invoice</h2>' +
        '<p>Your card details go straight to Stripe. We never see or store them.</p>' +
        '<div class="cardbox" id="cardbox"><div class="cardload">Loading secure card field…</div></div>' +
        '<div class="testnote" id="testnote"></div>' +
        (st.allow_partial ?
          '<div class="amtrow"><label for="payamt">Amount to pay today</label>' +
          '<div class="amtwrap"><span>$</span><input id="payamt" type="text" inputmode="decimal" value="' + (st.balance_cents/100).toFixed(2) + '"></div>' +
          '<div class="amtnote">Paying part of it is fine. The rest stays on this invoice and you can come back to it.</div>' +
          '<div class="amterr" id="amterr"></div></div>' : '') +
        '<button class="paybtn" id="paybtn" disabled>Pay ' + due + '</button>' +
        '<div class="payerr" id="payerr"></div>' +
        '<div class="callrow"><a href="tel:+19035612966">Call the studio</a>' +
        '<a href="mailto:race@barestkd.fit">Email us</a></div></div>';

      var CHECKOUT = FN.replace('receipt-view', 'create-checkout');
      var STRIPE = null, CARD = null;
      var btn = document.getElementById('paybtn');
      var err = document.getElementById('payerr');
      var cardbox = document.getElementById('cardbox');

      function loadStripeJs() {
        if (window.Stripe) return Promise.resolve(true);
        return new Promise(function (res) {
          var sc = document.createElement('script');
          sc.src = 'https://js.stripe.com/v3/';
          sc.onload = function () { res(true); };
          sc.onerror = function () { res(false); };
          document.head.appendChild(sc);
        });
      }

      fetch(CHECKOUT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: token, action: 'config' })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok || !res.j.publishable_key) throw new Error(res.j.error || 'Card payments are not set up.');
          return loadStripeJs().then(function (ok) {
            if (!ok) throw new Error('Could not reach Stripe.');
            STRIPE = window.Stripe(res.j.publishable_key);
            CARD = STRIPE.elements().create('card', {
              style: { base: { fontSize: '16px', color: '#15171C', '::placeholder': { color: '#9AA4AF' } } }
            });
            cardbox.innerHTML = '';
            CARD.mount(cardbox);
            CARD.on('change', function (e) { err.textContent = e.error ? e.error.message : ''; });
            btn.disabled = false;
            if (res.j.publishable_key.indexOf('pk_live_') !== 0) {
              document.getElementById('testnote').textContent =
                'Test mode: use 4242 4242 4242 4242 with any future expiry and CVC.';
            }
          });
        })
        .catch(function (e) {
          cardbox.innerHTML = '<div class="cardload">' +
            ((e && e.message) || 'Card payments are unavailable right now.') +
            ' Please call the studio and we can take payment over the phone.</div>';
        });

      // What they are paying. Only consulted when this invoice allows a
      // partial; otherwise the server charges the full balance regardless.
      var amtEl = document.getElementById('payamt');
      var amtErr = document.getElementById('amterr');
      var MIN_CENTS = 500;

      function askedCents() {
        if (!st.allow_partial || !amtEl) return null;
        var raw = String(amtEl.value || '').replace(/[$,\s]/g, '');
        if (!raw) return 'empty';
        var n = Number(raw);
        if (!isFinite(n)) return 'bad';
        var cents = Math.round(n * 100);
        if (cents < MIN_CENTS) return 'low';
        if (cents > st.balance_cents) return 'high';
        return cents;
      }

      // Keep the button honest about what it is about to charge.
      if (amtEl) {
        amtEl.addEventListener('input', function () {
          var a = askedCents();
          if (typeof a === 'number') {
            btn.textContent = 'Pay $' + (a / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            amtErr.style.display = 'none';
          } else {
            btn.textContent = 'Pay ' + due;
          }
        });
      }

      btn.addEventListener('click', function () {
        if (!CARD) return;
        var asked = askedCents();
        if (typeof asked === 'string') {
          var msg = asked === 'high' ? 'That is more than the ' + due + ' still owed on this invoice.'
            : asked === 'low' ? 'The smallest payment we can take online is $5.00.'
            : 'Enter the amount you would like to pay.';
          amtErr.textContent = msg; amtErr.style.display = 'block';
          amtEl.focus();
          return;
        }
        btn.disabled = true; btn.textContent = 'Charging…'; err.textContent = '';
        fetch(CHECKOUT, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(asked === null
            ? { t: token, action: 'intent' }
            : { t: token, action: 'intent', amount_cents: asked })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok || !res.j.client_secret) throw new Error(res.j.error || 'Could not start the payment.');
            return STRIPE.confirmCardPayment(res.j.client_secret, { payment_method: { card: CARD } });
          })
          .then(function (r2) {
            if (r2.error) throw new Error(r2.error.message || 'Your card was declined.');
            if (!r2.paymentIntent || r2.paymentIntent.status !== 'succeeded') throw new Error('The payment did not complete.');
            btn.textContent = 'Finishing up…';
            return fetch(CHECKOUT, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ t: token, action: 'finalize', payment_intent_id: r2.paymentIntent.id })
            }).then(function (r3) { return r3.json(); });
          })
          .then(function (j3) {
            if (!j3 || !j3.ok) throw new Error((j3 && j3.error) || 'The card was charged but the invoice did not update. Please call the studio.');
            location.href = location.pathname + '?t=' + token + '&paid=1';
          })
          .catch(function (e) {
            btn.disabled = false;
            var a2 = askedCents();
            btn.textContent = (typeof a2 === 'number' && a2 !== st.balance_cents)
              ? 'Pay $' + (a2 / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
              : 'Pay ' + due;
            err.textContent = (e && e.message) || 'Could not take the payment. Please try again or call the studio.';
          });
      });
    })
    .catch(function (e) {
      if (e && e.message === 'notfound') {
        fail('Invoice not found', 'This link may have been replaced. Ask the studio to send it again.');
      } else {
        fail('Couldn’t load this invoice', 'Please try again in a moment, or call 903-561-2966.');
      }
    });
})();
</script>
</body>
</html>
