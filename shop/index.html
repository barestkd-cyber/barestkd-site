<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pro Shop | Bares Taekwondo Fitness</title>
<style>
  :root{
    --red:#EA0000; --ink:#141414; --muted:#6B7076;
    --line:#E5E5E5; --bg:#FFFFFF; --card:#fff; --soft:#F5F5F5;
  }
  *{box-sizing:border-box}
  /* The hidden attribute always wins. Without this, any rule that sets a
     display (the Category box, the cart) quietly un-hides the element. */
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
  /* The Pro Shop mark, transparent. Every letter carries its own black
     outline, which is what keeps the white TAEKWONDO and PRO readable sitting
     straight on the page, so no background band is needed. */
  header{position:relative;text-align:center;padding:6px 0 14px;border-bottom:4px solid var(--red)}
  header img{display:block;margin:0 auto;width:100%;max-width:340px;height:auto}
  header p{margin:8px 0 0;color:var(--muted);font-size:.78rem;letter-spacing:.05em}

  /* The cart (owner, 2026-09-10). On a computer it is the button top right,
     beside the logo, like any other shop. On a phone the logo fills the
     width and that button would sit on the PRO, so the cart is instead a bar
     pinned to the bottom of the screen, one tap away from anywhere in a long
     list. The bar shows once something is in the cart. */
  .cart-btn{position:absolute;top:4px;right:0;border:0;background:var(--ink);color:#fff;
            border-radius:10px;padding:9px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;
            font:inherit;font-size:.8rem;font-weight:700}
  .cart-btn svg{width:20px;height:20px}
  .cart-btn .n{background:var(--red);color:#fff;border-radius:10px;min-width:20px;height:20px;
               padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem}
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:50;width:100%;display:none;
           background:#fff;border:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);
           padding:10px 14px calc(10px + env(safe-area-inset-bottom));font:inherit;color:var(--ink);
           cursor:pointer;text-align:left}
  .cartbar .in{display:flex;align-items:center;gap:14px}
  .cartbar .ico{position:relative;display:flex;flex:0 0 auto}
  .cartbar svg{width:26px;height:26px}
  .cartbar .n{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;border-radius:10px;
              min-width:19px;height:19px;padding:0 5px;font-size:.7rem;font-weight:700;
              display:flex;align-items:center;justify-content:center}
  .cartbar .sum{flex:1;min-width:0;line-height:1.25}
  .cartbar .sum small{display:block;color:var(--muted);font-size:.75rem}
  .cartbar .sum b{font-size:1rem}
  .cartbar .go{background:var(--red);color:#fff;border-radius:9px;padding:11px 16px;font-weight:700;
               font-size:.82rem;letter-spacing:.03em;text-transform:uppercase;flex:0 0 auto}
  @media (max-width:559px){
    .cart-btn{display:none}
    .cartbar{display:block}
    .wrap{padding-bottom:110px}   /* the last row of the grid clears the bar */
  }

  .notice{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--red);
          border-radius:8px;padding:12px 14px;margin:16px 0;font-size:.85rem;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin:14px 0}
  .card h2{margin:0 0 4px;font-size:1.05rem}
  .sub{color:var(--muted);font-size:.83rem;line-height:1.5;margin:0 0 10px}
  .step{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}

  /* the package, on Sparring Gear only */
  .pack{border:2px solid var(--ink);box-shadow:0 2px 14px rgba(0,0,0,.07)}
  .pack .price{font-size:1.5rem;font-weight:800;margin:2px 0 6px}
  .pack ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.83rem;line-height:1.6}

  /* tabs, then search and the Category dropdown on one line */
  .tabs{display:flex;gap:8px;margin:18px 0 12px}
  .tab{flex:1;padding:11px 8px;border:1px solid var(--line);background:#fff;border-radius:9px;
       font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  /* Four tabs do not fit across a phone ("Kickboxing" alone is wider than a
     quarter of the screen), so on a phone they sit two by two. */
  @media (max-width:559px){
    .tabs{display:grid;grid-template-columns:1fr 1fr}
    .tab:last-child:nth-child(odd){grid-column:1/-1}
  }
  .toolbar{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
  .toolbar .search{flex:1;min-width:0}
  .search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
  .cat{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);font-weight:700;
       letter-spacing:.05em;text-transform:uppercase;gap:4px;flex:0 0 auto}
  .cat select{padding:10px;min-width:150px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink)}

  /* the grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;
        cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column}
  .tile:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .tile .ph{aspect-ratio:1/1;background:#F7F7F7;border-radius:8px;display:flex;
            align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
  .tile .ph img{max-width:100%;max-height:100%;object-fit:contain}
  /* A school shirt's tile IS the shirt: its own colour, the print on it. */
  .tile .ph.sw{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .tile .ph.sw img{max-width:72%;max-height:72%}
  /* A photo that runs to its own edges fills the square, trimmed a hair so
     its thin frame line never shows. */
  .ph.fill img,.tile .ph.fill img,.shots .ph.fill img{width:104%;height:104%;max-width:none;max-height:none;object-fit:cover}
  .shots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 auto 8px}
  .shots figure{margin:0;flex:0 1 170px;text-align:center}
  .shots .ph{aspect-ratio:1/1;border-radius:8px;display:flex;align-items:center;justify-content:center;
             overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .shots .ph img{max-width:72%;max-height:72%;object-fit:contain}
  .shots figcaption{font-size:.72rem;color:var(--muted);margin-top:4px}
  .tile .nm{font-size:.83rem;font-weight:600;line-height:1.3}
  .tile .pr{margin-top:auto;padding-top:6px;font-size:.88rem;font-weight:700}
  .tile .tag{font-size:.68rem;color:var(--muted);margin-top:2px}
  .empty{grid-column:1/-1;color:var(--muted);font-size:.85rem;padding:18px 4px}

  /* pop-ups: the product picker, the package builder and the cart share one;
     checkout has its own, because the Stripe card field must survive */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;
         align-items:flex-end;justify-content:center}
  .scrim.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;
         padding:16px 16px 22px;max-height:90vh;overflow:auto}
  @media (min-width:560px){ .scrim{align-items:center} .sheet{border-radius:14px} }
  .sheet h3{margin:0 0 2px;font-size:1.05rem}
  .sheet .close{position:absolute;right:0;top:-4px;border:0;background:none;font-size:1.6rem;
                cursor:pointer;color:var(--muted);padding:4px 8px}
  .sheet-hd{position:relative;padding-right:34px;margin-bottom:10px}
  #coScrim{z-index:70}

  select,input,textarea{font:inherit;padding:10px;border:1px solid var(--line);
        border-radius:7px;background:#fff;color:var(--ink);max-width:100%}
  label.fld{display:block;margin:10px 0 0;font-size:.8rem;color:var(--muted)}
  label.fld select,label.fld input,label.fld textarea{width:100%;margin-top:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){ .row2{grid-template-columns:1fr} }
  .tot{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.88rem}
  .tot.big{font-weight:700;font-size:1.05rem;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #EEEEEE;font-size:.88rem}
  .line:first-child{border-top:0}
  button.pay{width:100%;margin-top:14px;padding:14px;border:0;border-radius:9px;
        background:var(--red);color:#fff;font-weight:700;font-size:.98rem;
        letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
  button.pay.go{background:var(--ink)}
  button.pay:disabled{background:#C9C6C0;cursor:not-allowed}
  .lnk{background:none;border:0;color:var(--muted);font:inherit;font-size:.76rem;
       text-decoration:underline;cursor:pointer;padding:0}
  .err{background:#FBE9E9;border:1px solid #E9B7B7;color:#8A1F1F;border-radius:8px;
       padding:11px 13px;margin:12px 0;font-size:.86rem}
  #cardbox{border:1px solid var(--line);border-radius:7px;padding:12px;background:#fff;margin-top:6px;min-height:44px}
  .done{text-align:center;padding:30px 10px}
  .done h2{color:var(--ink)}
  .hp{position:absolute;left:-9999px}

  /* "Added to cart". Hidden by opacity and visibility, never by sliding it
     off the top: a slide measured in its own height left the bottom of the
     pill peeking out above the logo before anything was added. Visibility
     flips after the fade out, and at once on the way in. */
  .toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-10px);opacity:0;visibility:hidden;
         background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:.85rem;font-weight:600;
         z-index:80;pointer-events:none;
         transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);
            transition:opacity .2s ease,transform .2s ease,visibility 0s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/"><img src="/assets/img/pro-shop-logo.png" width="640" height="256"
       alt="Bares Taekwondo Fitness Pro Shop"></a>
    <p>Gear for class, ordered for you</p>
    <button class="cart-btn" id="cartBtn" type="button" aria-label="Your cart" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span class="n" id="cartN">0</span>
    </button>
  </header>

  <div id="boot" class="sub" style="text-align:center;padding:30px 0">Loading the shop...</div>
  <div id="closed" hidden></div>

  <div id="app" hidden>
    <div class="notice" id="notice"></div>

    <!-- The tabs come first, so a kickboxer is never made to scroll past a
         taekwondo package to find their gloves (owner, 2026-09-10). -->
    <div class="tabs" id="tabs"></div>

    <!-- The package belongs to Sparring Gear only, and is shown only on that
         tab. It stays compact: the sizes are picked in a pop-up. -->
    <div class="card pack" id="packCard">
      <h2 id="packName">Beginner Gear Package</h2>
      <div class="price" id="packTotal">-</div>
      <p class="sub" id="packNote"></p>
      <ul id="packList"></ul>
      <div class="sub" id="packExtras" style="margin:10px 0 0"></div>
      <button class="pay go" id="packBtn" type="button">Build my package</button>
    </div>

    <!-- One Category dropdown per tab, not a row of pills: tabs inside a tab
         confused people (owner, 2026-09-10). -->
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search the shop" autocomplete="off">
      <label class="cat" id="catWrap" hidden>Category<select id="cat"></select></label>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="done" class="done" hidden>
    <h2>Thank you</h2>
    <p class="sub" id="doneMsg"></p>
    <div id="receipt"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- phones: the cart, pinned to the bottom of the screen -->
<button class="cartbar" id="cartBar" type="button" aria-label="Your cart" hidden>
  <span class="in">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg><span class="n" id="barN">0</span></span>
    <span class="sum"><small id="barItems">0 items</small><b id="barSum">$0.00</b></span>
    <span class="go">View cart</span>
  </span>
</button>

<!-- shared: product picker, package builder, cart -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<!-- checkout: its own pop-up, built once, so the Stripe card field is never
     destroyed by another pop-up replacing its contents -->
<div class="scrim" id="coScrim">
  <div class="sheet" id="coSheet">
    <div class="sheet-hd">
      <button class="close" type="button" data-coclose="1" aria-label="Close">&times;</button>
      <h3>Checkout</h3>
      <div class="sub" style="margin:2px 0 0" id="coSummary"></div>
    </div>
    <div class="step">Who it is for</div>
    <div class="row2">
      <label class="fld">Student first name<input id="sFirst" autocomplete="off"></label>
      <label class="fld">Student last name<input id="sLast" autocomplete="off"></label>
    </div>
    <div class="step" style="margin-top:14px">Your details</div>
    <div class="row2">
      <label class="fld">Your first name<input id="bFirst" autocomplete="given-name"></label>
      <label class="fld">Your last name<input id="bLast" autocomplete="family-name"></label>
    </div>
    <div class="row2">
      <label class="fld">Email<input id="bEmail" type="email" autocomplete="email"></label>
      <label class="fld">Phone<input id="bPhone" type="tel" autocomplete="tel"></label>
    </div>
    <label class="fld">Anything we should know (optional)<textarea id="bNote" rows="2"></textarea></label>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="step" style="margin-top:14px">Card</div>
    <div id="cardbox"></div>
    <div id="coTotals" style="margin-top:12px"></div>
    <p class="sub" id="cadence" style="margin-top:8px"></p>
    <div id="payErr"></div>
    <button class="pay" id="payBtn" type="button">Pay</button>
    <div style="text-align:center;margin-top:10px">
      <button class="lnk" type="button" data-backcart="1">Back to cart</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var FN = "https://akdncbzxiwvihfcyijvm.supabase.co/functions/v1/shop";
  var SB_KEY = "sb_publishable_uSGIk4_Tt1_BOmPBoC_U5A_Kp2032f5";
  var CFG = null, STRIPE = null, CARD = null, CARD_MOUNTED = false;
  var CART = [];                 // { variant_id, qty, from_package, label, cents }
  var TAB = "sparring", CAT = "", Q = "";
  var HAS_PACK = false;          // set once the catalogue loads
  var SALE_ID = (self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID() : null;

  function $(id) { return document.getElementById(id); }
  function money(c) { return "$" + (Number(c) / 100).toFixed(2); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
    });
  }

  /* The card fee, grossed up: the smallest total that still nets the asking
     price after Stripe takes its percentage OF THAT TOTAL. Byte-identical to
     the copy on every other checkout page and to BTKDPricing.cardFeeCents,
     which the copy lint pins, because a page that quotes a different number
     from the server that charges it reads as the page lying. */
  function cardFeeCents(baseCents, bps, flatCents) {
    var base = Math.round(Number(baseCents) || 0);
    var rate = Math.round(Number(bps) || 0);
    var flat = Math.round(Number(flatCents) || 0);
    if (base <= 0) return 0;
    if (!rate && !flat) return 0;
    if (rate >= 10000) return 0;
    var nets = function (t) { return t - (Math.floor(t * rate / 10000 + 0.5) + flat); };
    var total = Math.ceil((base + flat) * 10000 / (10000 - rate));
    while (total > base && nets(total - 1) >= base) total--;
    while (nets(total) < base) total++;
    return total - base;
  }

  /* Gear is all taxable, and the fee grosses up on goods PLUS tax because
     Stripe's cut lands on the tax too. Same order the server uses. */
  function totals() {
    var sub = CART.reduce(function (a, x) { return a + x.cents * x.qty; }, 0);
    var tax = Math.floor(sub * CFG.tax_rate + 0.5);
    var fee = cardFeeCents(sub + tax, CFG.admin_fee_bps, CFG.admin_fee_flat_cents);
    return { sub: sub, tax: tax, fee: fee, total: sub + tax + fee };
  }

  /* ---- catalogue helpers ------------------------------------------------ */
  function allProducts() { return CFG.package.concat(CFG.extras); }
  function sizesOf(p) {
    var out = [], seen = {};
    p.variants.forEach(function (v) { if (v.size && !seen[v.size]) { seen[v.size] = 1; out.push(v.size); } });
    return out;
  }
  function colorsOf(p) {
    var out = [], seen = {};
    p.variants.forEach(function (v) { if (v.color && !seen[v.color]) { seen[v.color] = 1; out.push(v.color); } });
    // Restricted colours go last. Century lists Black first, and Black is the
    // black-belt colourway, so straight off the vendor a white belt's first
    // option was the one they cannot have.
    var gated = {};
    p.variants.forEach(function (v) { if (v.black_belt_only && v.color) gated[v.color] = 1; });
    out.sort(function (a, b) { return (gated[a] ? 1 : 0) - (gated[b] ? 1 : 0); });
    return out;
  }
  function priceFrom(p) { return Math.min.apply(null, p.variants.map(function (v) { return v.cents; })); }
  function priceTo(p) { return Math.max.apply(null, p.variants.map(function (v) { return v.cents; })); }
  var TYPE_LABEL = { sparring:"Sparring gear", kickboxing:"Kickboxing", uniform:"Uniforms", shirt:"Shirts",
                     bag:"Bags", belt:"Belts", other:"Other" };
  function typeLabel(t) { return TYPE_LABEL[t] || t; }
  /* The Category dropdown reads the product's own category; a product that
     has none yet falls back to its type, so nothing is ever uncategorised. */
  function catOf(p) { return p.category || typeLabel(p.item_type); }
  /* The dropdown lists the main thing on each tab first, in the order the
     owner named them; anything new sorts after, alphabetically. */
  var CAT_ORDER = ["Sparring gear", "Bags", "Boxing gloves", "Shin guards", "Pads"];
  function catRank(c) { var i = CAT_ORDER.indexOf(c); return i < 0 ? CAT_ORDER.length : i; }

  /* The tabs a product appears on. Usually one, from its type. But anything
     in the Beginner Gear Package also appears on Sparring Gear, because that
     is where the package lives: so the duffle bag, a "bag" by type, shows on
     Sparring Gear and on Everything Else. */
  function tabsOf(p) {
    var t = [];
    if (p.item_type === "sparring" || p.role) t.push("sparring");
    if (p.item_type === "kickboxing") t.push("kickboxing");
    // The school's own shirts, the ones the checkout pages sell (owner,
    // 2026-09-11). Priced from the CRM catalogue by the server.
    if (p.item_type === "shirt") t.push("shirts");
    if (p.item_type !== "sparring" && p.item_type !== "kickboxing" && p.item_type !== "shirt") t.push("other");
    return t;
  }
  function inTab(p) { return tabsOf(p).indexOf(TAB) >= 0; }

  function visible() {
    var q = Q.trim().toLowerCase();
    return allProducts().filter(function (p) {
      if (!inTab(p)) return false;
      if (CAT && catOf(p) !== CAT) return false;
      if (q && p.title.toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  /* ---- rendering -------------------------------------------------------- */
  var TABS = [["sparring", "Sparring Gear"], ["kickboxing", "Kickboxing"], ["shirts", "T-Shirts"],
              ["other", "Everything Else"]];
  function renderTabs() {
    var counts = { sparring: 0, kickboxing: 0, shirts: 0, other: 0 };
    allProducts().forEach(function (p) { tabsOf(p).forEach(function (t) { counts[t]++; }); });
    // A tab with nothing in it is not offered: an empty tab is only a dead end.
    $("tabs").innerHTML = TABS.filter(function (t) { return counts[t[0]] > 0 || t[0] === TAB; })
      .map(function (t) {
        return '<button class="tab' + (TAB === t[0] ? " on" : "") + '" type="button" data-tab="' + t[0] + '">'
          + esc(t[1]) + ' <span style="opacity:.7">' + counts[t[0]] + '</span></button>';
      }).join("");
  }
  /* One Category dropdown for the tab. Hidden when the tab holds a single
     category, where "All" would be its only real choice. */
  function renderCats() {
    var cats = [], seen = {};
    allProducts().forEach(function (p) {
      if (!inTab(p)) return;
      var c = catOf(p);
      if (!seen[c]) { seen[c] = 1; cats.push(c); }
    });
    cats.sort(function (a, b) { return catRank(a) - catRank(b) || (a < b ? -1 : a > b ? 1 : 0); });
    if (CAT && !seen[CAT]) CAT = "";
    $("catWrap").hidden = cats.length < 2;
    $("cat").innerHTML = '<option value="">All</option>' + cats.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === CAT ? " selected" : "") + '>' + esc(c) + '</option>';
    }).join("");
  }
  function renderGrid() {
    var list = visible();
    if (!list.length) {
      $("grid").innerHTML = '<div class="empty">Nothing here'
        + (Q ? ' for "' + esc(Q) + '"' : "") + '. Try another category or tab.</div>';
      return;
    }
    $("grid").innerHTML = list.map(function (p) {
      var lo = priceFrom(p), hi = priceTo(p);
      var ph = p.swatch ? '<div class="ph sw' + (p.fill ? " fill" : "") + '" style="background:' + esc(p.swatch) + '">'
        : '<div class="ph">';
      return '<button class="tile" type="button" data-open="' + esc(p.id) + '">'
        + ph + (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" loading="lazy">' : "") + '</div>'
        + '<div class="nm">' + esc(p.title) + '</div>'
        + (p.logo ? '<div class="tag">school logo included</div>' : "")
        + '<div class="pr">' + (lo === hi ? money(lo) : money(lo) + "+") + '</div>'
        + '</button>';
    }).join("");
  }
  function renderShopBody() {
    renderTabs();
    $("packCard").hidden = !(HAS_PACK && TAB === "sparring");
    renderCats(); renderGrid();
  }

  /* ---- the shared pop-up: picker, package builder, cart ------------------ */
  function openSheet(html) {
    $("sheet").innerHTML = html;
    $("scrim").classList.add("on");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    $("scrim").classList.remove("on");
    if (!$("coScrim").classList.contains("on")) document.body.style.overflow = "";
  }

  function pickerRows(p, prefix) {
    var sizes = sizesOf(p), colors = colorsOf(p), h = "";
    if (sizes.length) {
      h += '<label class="fld">Size<select id="' + prefix + '-s-' + esc(p.id) + '">'
        + (sizes.length > 1 ? '<option value="">Pick a size</option>' : "")
        + sizes.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join("")
        + '</select></label>';
    }
    if (colors.length > 1) {
      var what = p.color_label || "Colour";
      h += '<label class="fld">' + esc(what) + '<select id="' + prefix + '-c-' + esc(p.id) + '">'
        + '<option value="">Pick a ' + esc(what.toLowerCase()) + '</option>'
        + colors.map(function (c) {
            var bb = p.variants.some(function (v) { return v.color === c && v.black_belt_only; });
            return '<option value="' + esc(c) + '">' + esc(c) + (bb ? " (black belts only)" : "") + '</option>';
          }).join("")
        + '</select></label>';
    }
    return h;
  }

  /* The picture in the pop-up. A school shirt shows every side it has, front
     and back, or the girl and boy artwork, on the shirt's own colour. */
  function shotsHtml(p) {
    if (p.images && p.images.length) {
      return '<div class="shots">' + p.images.map(function (im) {
        return '<figure><div class="ph' + (p.fill ? " fill" : "") + '" style="background:' + esc(p.swatch || "#F7F7F7") + '"><img src="'
          + esc(im.src) + '" alt="' + esc(p.title + ", " + im.label) + '"></div>'
          + '<figcaption>' + esc(im.label) + '</figcaption></figure>';
      }).join("") + '</div>';
    }
    return p.image_url ? '<div class="ph" style="max-width:190px;margin:0 auto 8px"><img src="'
      + esc(p.image_url) + '" alt="" style="max-width:100%"></div>' : "";
  }

  function openProduct(id) {
    var p = allProducts().filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var lo = priceFrom(p), hi = priceTo(p);
    openSheet('<div class="sheet-hd"><button class="close" type="button" data-close="1" aria-label="Close">&times;</button>'
      + '<h3>' + esc(p.title) + '</h3>'
      + '<div class="sub" style="margin:2px 0 0">' + (lo === hi ? money(lo) : money(lo) + " to " + money(hi))
      + (p.logo ? " with the school logo" : "") + '</div>'
      + (p.lead_time_text ? '<div class="sub" style="margin:2px 0 0">' + esc(p.lead_time_text) + '</div>' : "")
      + '</div>'
      + shotsHtml(p)
      + pickerRows(p, "i")
      + '<label class="fld">How many<select id="i-q-' + esc(p.id) + '">'
      + [1,2,3,4,5].map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join("")
      + '</select></label>'
      + '<div id="sheetErr"></div>'
      + '<button class="pay go" type="button" data-addone="' + esc(p.id) + '">Add to cart</button>');
  }

  /* Every product carries its part in the package: required, boys (required
     only when it is for a boy), optional, or none. */
  function byRole(r) { return allProducts().filter(function (p) { return p.role === r; }); }
  function titles(ps) {
    var t = ps.map(function (p) { return p.title; });
    return t.length < 2 ? t.join("") : t.slice(0, -1).join(", ") + " and " + t[t.length - 1];
  }

  /* The builder. Required pieces always. The cup and supporter appear, and
     become required, the moment "this is for a boy" is ticked. The face shield
     and elbow pads are optional ticks, each opening its own size picker. The
     button carries the running total so a tick shows its price first. */
  function openPackage() {
    var req = byRole("required"), boys = byRole("boys"), opt = byRole("optional");
    var piece = function (p, prefix) {
      return '<div style="padding:10px 0;border-top:1px solid #EEEEEE">'
        + '<div style="font-weight:600;font-size:.9rem">' + esc(p.title)
        + ' <span style="color:var(--muted);font-weight:400">' + money(priceFrom(p)) + '</span></div>'
        + pickerRows(p, prefix) + '</div>';
    };
    var h = '<div class="sheet-hd"><button class="close" type="button" data-close="1" aria-label="Close">&times;</button>'
      + '<h3>' + esc(CFG.package_name || "Beginner Gear Package") + '</h3>'
      + '<div class="sub" style="margin:2px 0 0">Pick a size for each piece.</div></div>';
    if (boys.length) {
      h += '<label style="display:flex;gap:10px;align-items:center;margin:4px 0 10px;'
        + 'font-weight:600;cursor:pointer;background:var(--soft);border:1px solid var(--line);'
        + 'border-radius:8px;padding:10px 12px">'
        + '<input type="checkbox" id="pkBoy" style="width:20px;height:20px;margin:0">'
        + '<span>This is for a boy<span class="sub" style="display:block;margin:2px 0 0;font-weight:400">'
        + 'Boys also need ' + esc(titles(boys)) + '.</span></span></label>';
    }
    h += req.map(function (p) { return piece(p, "p"); }).join("");
    if (boys.length) {
      h += '<div id="pkBoys" hidden><div class="step" style="margin-top:14px">Required for boys</div>'
        + boys.map(function (p) { return piece(p, "p"); }).join("") + '</div>';
    }
    if (opt.length) {
      h += '<div class="step" style="margin-top:16px">Add to the package, optional</div>'
        + opt.map(function (p) {
            return '<div style="padding:10px 0;border-top:1px solid #EEEEEE">'
              + '<label style="display:flex;gap:10px;align-items:center;font-weight:600;font-size:.9rem;cursor:pointer">'
              + '<input type="checkbox" data-opt="' + esc(p.id) + '" style="width:20px;height:20px;margin:0">'
              + '<span>' + esc(p.title) + ' <span style="color:var(--muted);font-weight:400">'
              + money(priceFrom(p)) + '</span></span></label>'
              + '<div id="optp-' + esc(p.id) + '" hidden>' + pickerRows(p, "o") + '</div></div>';
          }).join("");
    }
    h += '<div id="sheetErr"></div>'
      + '<button class="pay go" type="button" data-addpack="1" id="pkAdd">Add the package</button>';
    openSheet(h);
    pkTotal();
  }

  /* What a piece costs as currently picked, or its cheapest if not picked yet:
     the headgear is dearer in the big sizes, so the button follows the pick. */
  function pickedCents(p, prefix) {
    var got = pickVariant(p, prefix);
    return got.err ? priceFrom(p) : got.v.cents;
  }
  function pkTotal() {
    var btn = $("pkAdd"); if (!btn) return;
    var sum = byRole("required").reduce(function (a, p) { return a + pickedCents(p, "p"); }, 0);
    if ($("pkBoy") && $("pkBoy").checked) {
      sum += byRole("boys").reduce(function (a, p) { return a + pickedCents(p, "p"); }, 0);
    }
    byRole("optional").forEach(function (p) {
      var cb = document.querySelector('[data-opt="' + p.id + '"]');
      if (cb && cb.checked) sum += pickedCents(p, "o");
    });
    btn.textContent = "Add the package, " + money(sum);
  }

  function sheetErr(msg) {
    var el = $("sheetErr");
    if (el) el.innerHTML = msg ? '<div class="err">' + esc(msg) + "</div>" : "";
  }

  /* Resolve the chosen size and colour to one real variant. */
  function pickVariant(p, prefix) {
    var sizes = sizesOf(p), colors = colorsOf(p);
    var sEl = $(prefix + "-s-" + p.id), cEl = $(prefix + "-c-" + p.id);
    var wantS = sEl ? sEl.value : (sizes[0] || "");
    var wantC = cEl ? cEl.value : (colors[0] || "");
    if (sizes.length && !wantS) return { err: "Pick a size for the " + p.title + "." };
    if (colors.length > 1 && !wantC) {
      return { err: "Pick a " + (p.color_label || "colour").toLowerCase() + " for the " + p.title + "." };
    }
    var v = p.variants.filter(function (x) {
      return (!sizes.length || x.size === wantS) && (colors.length <= 1 || x.color === wantC);
    })[0];
    if (!v) return { err: "That size and colour is not available for the " + p.title + "." };
    return { v: v, label: p.title + [wantS, wantC].filter(Boolean).map(function (t) { return " " + t; }).join(",") };
  }

  function push(got, qty, fromPackage) {
    var found = null;
    CART.forEach(function (x) { if (x.variant_id === got.v.id) found = x; });
    if (found) found.qty += qty;
    else CART.push({ variant_id: got.v.id, qty: qty, from_package: !!fromPackage,
                     label: got.label, cents: got.v.cents });
  }

  function addOne(id) {
    var p = allProducts().filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var got = pickVariant(p, "i");
    if (got.err) { sheetErr(got.err); return; }
    var qEl = $("i-q-" + p.id);
    push(got, Math.max(1, parseInt(qEl ? qEl.value : "1", 10) || 1), false);
    closeSheet(); cartChanged(); toast("Added to cart");
  }

  function addPackage() {
    // Resolve EVERY piece before adding any of it. Adding what it could and
    // reporting the rest left a half package in the basket and quietly bumped
    // an already-chosen piece to two.
    var want = byRole("required").map(function (p) { return { p: p, prefix: "p" }; });
    if ($("pkBoy") && $("pkBoy").checked) {
      byRole("boys").forEach(function (p) { want.push({ p: p, prefix: "p" }); });
    }
    byRole("optional").forEach(function (p) {
      var cb = document.querySelector('[data-opt="' + p.id + '"]');
      if (cb && cb.checked) want.push({ p: p, prefix: "o" });
    });
    var picked = [], err = null;
    for (var i = 0; i < want.length; i++) {
      var got = pickVariant(want[i].p, want[i].prefix);
      if (got.err) { err = got.err; break; }
      picked.push(got);
    }
    if (err) { sheetErr(err); return; }
    picked.forEach(function (got) { push(got, 1, true); });
    closeSheet(); cartChanged(); toast("Package added to cart");
  }

  /* ---- the cart ---------------------------------------------------------- */
  function cartCount() { return CART.reduce(function (a, x) { return a + x.qty; }, 0); }
  /* Only school shirts in the cart: nothing waits on a Century batch. */
  function onlyShirts() {
    return CART.length > 0 && CART.every(function (x) { return String(x.variant_id).indexOf("tee|") === 0; });
  }

  /* Everything that depends on what is in the cart, in one place: the
     computer's cart button, the phone's cart bar, and the checkout pop-up if
     it is open. The bar shows the full total, fee included, so the number a
     parent sees before tapping is the number they will pay. */
  function cartChanged() {
    var n = cartCount();
    $("cartN").textContent = n;
    $("barN").textContent = n;
    $("barItems").textContent = n + (n === 1 ? " item" : " items");
    $("barSum").textContent = money(totals().total) + " total";
    $("cartBar").hidden = !n;
    if ($("coScrim").classList.contains("on")) renderCheckoutTotals();
  }

  function totalsHtml() {
    var t = totals();
    return '<div class="tot"><span>Subtotal</span><span>' + money(t.sub) + '</span></div>'
      + '<div class="tot"><span>Sales tax</span><span>' + money(t.tax) + '</span></div>'
      + '<div class="tot"><span>Card processing</span><span>' + money(t.fee) + '</span></div>'
      + '<div class="tot big"><span>Total</span><span>' + money(t.total) + '</span></div>';
  }

  function openCart() {
    var head = '<div class="sheet-hd"><button class="close" type="button" data-close="1" aria-label="Close">&times;</button>'
      + '<h3>Your cart</h3></div>';
    if (!CART.length) {
      openSheet(head + '<p class="sub">Your cart is empty. Tap any item to add it.</p>');
      return;
    }
    openSheet(head
      + '<div>' + CART.map(function (x, i) {
          return '<div class="line"><span>' + esc(x.label) + (x.qty > 1 ? " <strong>x" + x.qty + "</strong>" : "")
            + '<br><button class="lnk" type="button" data-rm="' + i + '">Remove</button></span>'
            + '<span>' + money(x.cents * x.qty) + '</span></div>';
        }).join("") + '</div>'
      + '<div style="margin-top:8px">' + totalsHtml() + '</div>'
      + '<button class="pay" type="button" data-checkout="1">Checkout</button>');
  }

  /* ---- checkout ---------------------------------------------------------- */
  /* The card field is mounted once, the first time checkout is visible.
     Mounting into a hidden element can size it wrongly, and remounting would
     throw away what the parent had typed. */
  function mountCard() {
    if (CARD_MOUNTED || !STRIPE || !$("coScrim").classList.contains("on")) return;
    CARD = STRIPE.elements().create("card", { hidePostalCode: false });
    CARD.mount("#cardbox");
    CARD_MOUNTED = true;
  }
  function renderCheckoutTotals() {
    var n = cartCount(), t = totals();
    $("coSummary").textContent = n + (n === 1 ? " item" : " items") + ", " + money(t.total);
    $("coTotals").innerHTML = totalsHtml();
    $("payBtn").textContent = "Pay " + money(t.total);
    $("payBtn").disabled = !CART.length;
    // The Century batch timing means nothing to somebody buying only a shirt.
    $("cadence").hidden = onlyShirts() || !CFG.cadence_text;
  }
  function openCheckout() {
    if (!CART.length) return;
    closeSheet();
    renderCheckoutTotals();
    showErr(null);
    $("coScrim").classList.add("on");
    document.body.style.overflow = "hidden";
    mountCard();
  }
  function closeCheckout() {
    $("coScrim").classList.remove("on");
    document.body.style.overflow = "";
  }

  /* ---- a word when something is added ------------------------------------ */
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2200);
  }

  /* ---- boot ------------------------------------------------------------- */
  function boot() {
    fetch(FN, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        $("boot").hidden = true;
        if (!res.ok || res.j.closed) {
          $("closed").hidden = false;
          $("closed").innerHTML = '<div class="err">' + esc(res.j.error || "The Pro Shop is not open right now.") + "</div>";
          return;
        }
        CFG = res.j;
        $("app").hidden = false;
        $("cartBtn").hidden = false;
        $("notice").textContent = CFG.notice || "";
        $("packName").textContent = CFG.package_name || "Beginner Gear Package";
        $("packNote").textContent = CFG.package_note || "";
        $("cadence").textContent = CFG.cadence_text || "";

        var req = byRole("required");
        HAS_PACK = req.length > 0;
        if (!req.length) { $("packCard").hidden = true; }
        else {
          var sum = req.reduce(function (a, p) { return a + priceFrom(p); }, 0);
          $("packTotal").textContent = money(sum);
          $("packList").innerHTML = req.map(function (p) {
            return "<li>" + esc(p.title) + "</li>";
          }).join("");
          var boys = byRole("boys"), opt = byRole("optional"), notes = [];
          if (boys.length) {
            var bsum = boys.reduce(function (a, p) { return a + priceFrom(p); }, 0);
            notes.push("<strong>Boys</strong> also need " + esc(titles(boys))
              + ", " + money(bsum) + " more.");
          }
          if (opt.length) notes.push("<strong>Optional:</strong> " + esc(titles(opt)) + ".");
          $("packExtras").innerHTML = notes.map(function (n) { return "<div>" + n + "</div>"; }).join("");
        }
        renderShopBody();
        wire();
        loadStripe();
      })
      .catch(function () {
        $("boot").hidden = true;
        $("closed").hidden = false;
        $("closed").innerHTML = '<div class="err">We could not load the Pro Shop. Please call 903-561-2966.</div>';
      });
  }

  function wire() {
    $("packBtn").addEventListener("click", openPackage);
    $("cartBtn").addEventListener("click", openCart);
    $("cartBar").addEventListener("click", openCart);
    $("tabs").addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("[data-tab]") : null;
      if (!t) return;
      TAB = t.getAttribute("data-tab"); CAT = "";
      renderShopBody();
    });
    $("cat").addEventListener("change", function (e) { CAT = e.target.value || ""; renderGrid(); });
    $("q").addEventListener("input", function (e) { Q = e.target.value || ""; renderGrid(); });
    $("grid").addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("[data-open]") : null;
      if (t) openProduct(t.getAttribute("data-open"));
    });

    // The shared pop-up: close, add one, add the package, remove, checkout.
    $("scrim").addEventListener("click", function (e) {
      if (e.target === $("scrim")) { closeSheet(); return; }
      var el = e.target.closest ? e.target : null;
      if (!el) return;
      if (el.closest("[data-close]")) { closeSheet(); return; }
      var one = el.closest("[data-addone]");
      if (one) { addOne(one.getAttribute("data-addone")); return; }
      if (el.closest("[data-addpack]")) { addPackage(); return; }
      var rm = el.closest("[data-rm]");
      if (rm) { CART.splice(Number(rm.getAttribute("data-rm")), 1); cartChanged(); openCart(); return; }
      if (el.closest("[data-checkout]")) { openCheckout(); }
    });
    // Inside the builder: the boy tick reveals the cup and supporter, an
    // optional tick reveals that piece's size picker, and any change re-prices
    // the button.
    $("scrim").addEventListener("change", function (e) {
      var t = e.target;
      if (t.id === "pkBoy") { var b = $("pkBoys"); if (b) b.hidden = !t.checked; }
      var oid = t.getAttribute && t.getAttribute("data-opt");
      if (oid) { var box = $("optp-" + oid); if (box) box.hidden = !t.checked; }
      pkTotal();
    });

    // Checkout: close, back to the cart, pay. Tapping the dimmed backdrop does
    // NOT close checkout, so a stray tap cannot throw away a typed-in card.
    $("coScrim").addEventListener("click", function (e) {
      var el = e.target.closest ? e.target : null;
      if (!el) return;
      if (el.closest("[data-coclose]")) { closeCheckout(); return; }
      if (el.closest("[data-backcart]")) { closeCheckout(); openCart(); }
    });
    $("payBtn").addEventListener("click", pay);
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      if ($("scrim").classList.contains("on")) closeSheet();
      else if ($("coScrim").classList.contains("on")) closeCheckout();
    });
  }

  function showErr(msg) {
    $("payErr").innerHTML = msg ? '<div class="err">' + esc(msg) + "</div>" : "";
    if (msg) $("payErr").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function loadStripe() {
    if (!CFG.publishable_key) return;
    var s = document.createElement("script");
    s.src = "https://js.stripe.com/v3/";
    s.onload = function () { STRIPE = Stripe(CFG.publishable_key); mountCard(); };
    s.onerror = function () { STRIPE = null; };
    document.head.appendChild(s);
  }

  /* ---- pay -------------------------------------------------------------- */
  function pay() {
    if (!CART.length) return;
    var need = [
      [$("sFirst").value, "Tell us the student's first name."],
      [$("sLast").value, "Tell us the student's last name."],
      [$("bFirst").value, "Tell us your first name."],
      [$("bLast").value, "Tell us your last name."],
      [$("bEmail").value, "We need an email for the receipt."]
    ];
    for (var i = 0; i < need.length; i++) {
      if (!String(need[i][0] || "").trim()) { showErr(need[i][1]); return; }
    }
    if (!STRIPE || !CARD) { showErr("Card payment is still loading. Give it a second, or call 903-561-2966."); return; }
    showErr(null);
    var btn = $("payBtn");
    btn.disabled = true; btn.textContent = "Working...";

    fetch(FN, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
      body: JSON.stringify({
        sale_id: SALE_ID,
        buyer_first: $("bFirst").value, buyer_last: $("bLast").value,
        email: $("bEmail").value, phone: $("bPhone").value,
        student_first: $("sFirst").value, student_last: $("sLast").value,
        note: $("bNote").value, hp: $("hp").value,
        items: CART.map(function (x) {
          return { variant_id: x.variant_id, qty: x.qty, from_package: x.from_package };
        })
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.paid && j.receipt_url) { finish(j.receipt_url); return null; }
        // Century sold out of something between the page loading and paying.
        // Nothing was charged or saved; drop just those pieces so the parent
        // can pick another size, or pay for the rest, without starting over.
        if (j.sold_out && j.sold_out.length) {
          CART = CART.filter(function (x) { return j.sold_out.indexOf(x.variant_id) < 0; });
          cartChanged();
        }
        if (!j.ok || !j.client_secret) { throw new Error(j.error || "We could not start the payment."); }
        return STRIPE.confirmCardPayment(j.client_secret, { payment_method: { card: CARD } })
          .then(function (res) {
            if (res.error) throw new Error(res.error.message || "That card was declined.");
            return fetch(FN, {
              method: "POST",
              headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
              body: JSON.stringify({ action: "finalize", sale_id: SALE_ID, payment_intent_id: res.paymentIntent.id })
            }).then(function (r2) { return r2.json(); });
          })
          .then(function (fin) {
            if (!fin || !fin.ok) throw new Error((fin && fin.error) || "The payment went through but we could not record it. Please call us.");
            finish(fin.receipt_url);
          });
      })
      .catch(function (e) {
        btn.disabled = !CART.length;
        btn.textContent = CART.length ? "Pay " + money(totals().total) : "Pay";
        var msg = String(e.message || e);
        // The server already says so for a sold-out item; do not say it twice.
        showErr(/nothing has been charged/i.test(msg) ? msg : msg + " Nothing has been charged.");
      });
  }

  function finish(receiptUrl) {
    closeCheckout();
    closeSheet();
    $("app").hidden = true;
    $("cartBtn").hidden = true;
    $("cartBar").hidden = true;
    $("done").hidden = false;
    $("doneMsg").textContent = (onlyShirts()
        ? "Your order is in. We will have it for you at the school, and "
        : "Your gear is ordered. We will let you know when it is at the school, and ")
      + ($("bEmail").value || "your email") + " has the receipt.";
    if (receiptUrl) {
      var t = /[?&]t=([0-9a-f]{32})/i.exec(receiptUrl);
      if (t) {
        fetch("https://akdncbzxiwvihfcyijvm.supabase.co/functions/v1/receipt-view?t=" + t[1] + "&f=frag",
          { cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (html) { $("receipt").innerHTML = html; })
          .catch(function () {
            $("receipt").innerHTML = '<p class="sub"><a href="' + esc(receiptUrl) + '">View your receipt</a></p>';
          });
      }
    }
    window.scrollTo(0, 0);
  }

  if (!SALE_ID) {
    $("boot").textContent = "This browser is too old for our checkout. Please call 903-561-2966.";
  } else {
    boot();
  }
})();
</script>
</body>
</html>
