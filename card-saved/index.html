<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card saved | Bares Taekwondo Fitness</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .cs-wrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:60px 20px}
  .cs-box{max-width:520px;text-align:center}
  .cs-tick{width:66px;height:66px;border-radius:50%;background:#1E1B18;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 22px}
  .cs-box h1{font-family:'Archivo Black',system-ui,sans-serif;font-size:30px;margin:0 0 14px;line-height:1.2}
  .cs-box p{font-size:16.5px;line-height:1.65;margin:0 0 16px;color:#4A4540}
  .cs-box .fine{font-size:13.5px;color:#6B655F}
  .cs-back{display:inline-block;margin-top:14px;background:#1E1B18;color:#fff;text-decoration:none;
    padding:13px 26px;border-radius:9px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<main class="cs-wrap">
  <div class="cs-box">
    <div class="cs-tick">&#10003;</div>
    <h1>Your card is saved</h1>
    <p>Thank you. Your payments will run on this card from now on. Nothing was
      charged just now.</p>
    <p class="fine">Your card is held securely by Stripe. The studio only ever
      sees the last four digits.</p>
    <a class="cs-back" href="/">Back to Bares Taekwondo</a>
  </div>
</main>
</body>
</html>
